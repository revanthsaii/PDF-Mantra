name: EAS Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

# Minimal required permissions — principle of least privilege
permissions:
  contents: read

jobs:
  # ── Step 1: always validate before building ───────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo Doctor check
        run: npx expo-doctor@latest

  # ── Step 2: build only if lint passes ─────────────────────────────────────
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck  # hard gate: won't run if lint job fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Build preview APK on every push to main
      - name: Build on EAS (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      # Manual dispatch — honours platform + profile inputs
      - name: Build on EAS (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && secrets.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive

  # ── Step 3: production submit only on version tag ─────────────────────────
  submit:
    name: Submit to Store
    runs-on: ubuntu-latest
    needs: build             # must have a successful build first
    if: startsWith(github.ref, 'refs/tags/v')
    # Requires a GitHub environment called "production" — add required reviewers
    # in Settings → Environments for a manual approval gate before store submit
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit to Google Play
        if: secrets.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --non-interactive
